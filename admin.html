<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>관리자 | 유니온원 철거</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f6;--surface:#fff;--text:#222;--muted:#777;--line:#e2e2e0;--btn:#0f8a43;--btn-d:#0b6e35;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;word-break:keep-all}
a{color:inherit;text-decoration:none}.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}.logo img{height:30px}
.hd small{color:var(--muted);font-size:13px}
main{padding:36px 0 80px}
h1{font-size:24px;font-weight:500;margin-bottom:6px}.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.box{background:var(--surface);border:1px solid var(--line);padding:24px;margin-bottom:28px}
.box h2{font-size:17px;font-weight:500;margin-bottom:16px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:5px;font-size:12px}.full{grid-column:1/-1}
input,textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--text);width:100%}
textarea{min-height:110px}input:focus,textarea:focus{outline:2px solid var(--btn);outline-offset:-1px}
.b{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:999px;padding:11px 22px;background:var(--btn);color:#fff;cursor:pointer}.b:hover{background:var(--btn-d)}.b:disabled{opacity:.6;cursor:default}
.b.o{background:transparent;color:var(--text);border:1px solid var(--muted)}.b.s{padding:6px 14px;font-size:12px}.b.r{background:#c33}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;min-height:20px}.msg.err{color:#c33}.msg.ok{color:var(--btn)}
.imgs{display:flex;gap:10px;flex-wrap:wrap}.imgs div{position:relative;width:96px;height:72px;border-radius:3px;overflow:hidden;background:#ddd}
.imgs img{width:100%;height:100%;object-fit:cover}.imgs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:400}
td.t{display:flex;align-items:center;gap:12px}td.t img,td.t i{width:56px;height:42px;object-fit:cover;border-radius:3px;background:#ddd;flex:none}
@media(max-width:600px){form{grid-template-columns:1fr}}
</style>
</head>

  }).then(function(){edit=null;return load()}).then(function(){view();var mm=document.getElementById('wm');mm.className='msg full ok';mm.textContent='저장되었습니다.'}).catch(function(x){b.disabled=false;m.className='msg full err';m.textContent=/column|schema/i.test(x.message)?'데이터베이스에 새 항목이 아직 없습니다. 안내드린 SQL(항목 추가)을 먼저 실행해 주세요.':x.message})}
}
