<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시공사례 | 유니온원 철거</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f6;--surface:#fff;--text:#222;--muted:#777;--line:#dcdcda;--btn:#0f8a43;--btn-d:#0b6e35;color-scheme:light}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;word-break:keep-all}
a{color:inherit;text-decoration:none}button{font:inherit}.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;white-space:nowrap}.logo img{height:28px;display:block}
.nav{display:flex;gap:28px;font-size:18px;font-weight:500}.nav a:hover,.nav a.on{color:var(--btn)}.nav a.on{border-bottom:2px solid var(--btn)}
.hr{display:flex;gap:8px;justify-content:flex-end}
.pill{font-size:15px;font-weight:500;padding:8px 16px;border-radius:999px;background:var(--btn);color:#fff;white-space:nowrap}.pill:hover{background:var(--btn-d)}
main{padding:40px 0 80px}
.crumb{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted);margin-bottom:28px}.crumb a:hover{color:var(--text)}
h1{font-weight:300;font-size:clamp(29px,3.4vw,43px);line-height:1.3}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--text);margin-bottom:32px;flex-wrap:wrap}
.tm{display:flex;gap:22px;font-size:15px;color:var(--muted)}.tm b{color:var(--text);font-weight:400;margin-left:6px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.gm{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#c9c6c0,#8d8a85);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:15px;letter-spacing:.2em}
.gm img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#ebe9e5}
.ga{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#222;font-size:23px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2}.ga.l{left:14px}.ga.r{right:14px}
.gc,.gn{position:absolute;bottom:0;color:#fff;font-size:15px;padding:14px 16px;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6)}.gc{left:0;right:80px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}.gn{right:0}
.gt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.gt button{background:none;border:2px solid transparent;padding:0;cursor:pointer;text-align:left;opacity:.6}.gt button.on{opacity:1;border-color:#000}
.gt .t{aspect-ratio:4/3;background:#b9b6b0;overflow:hidden;position:relative}.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gt small{display:block;font-size:14px;color:var(--muted);padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:26px 0;border-top:1px solid var(--line)}
.sec small{display:block;font-size:14px;color:var(--muted)}.sec h3{font-size:19px;font-weight:500}
.sec p{font-size:17px;line-height:1.9;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chips span{font-size:15px;border:1px solid var(--line);background:var(--surface);padding:5px 12px}.chips span::before{content:"✓ ";color:var(--btn)}
.body{margin-top:44px}
.ba-h{margin:44px 0 14px;display:flex;justify-content:space-between;align-items:flex-end}.ba-h small{font-size:14px;letter-spacing:.14em;color:var(--muted);display:block}.ba-h h2{font-weight:300;font-size:27px}.ba-h span{font-size:15px;color:var(--muted)}
.ba{position:relative;aspect-ratio:16/10;overflow:hidden;background:#ccc;user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ba .bb{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.ba .hd2{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-1px)}.ba .hd2::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#222;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .em{position:absolute;top:14px;font-size:15px;padding:3px 10px;z-index:2}.ba .a{right:14px;background:var(--btn);color:#fff}.ba .b{left:14px;background:#fff}
.side{display:grid;gap:16px;position:sticky;top:84px}
.card2{background:var(--surface);border:1px solid var(--line);padding:20px}.card2 h4{font-size:16px;font-weight:500;margin-bottom:12px}
.ov{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;font-size:15px}.ov dt{color:var(--muted)}.ov dd{text-align:right}
.cta{background:#000;color:#fff;padding:22px}.cta h4{font-size:19px;font-weight:400;margin-bottom:8px}.cta p{font-size:15px;color:#ccc;margin-bottom:16px}
.cta a{display:block;text-align:center;font-size:16px;font-weight:500;padding:12px;margin-top:8px}.cta .g{background:var(--btn)}.cta .w{border:1px solid #888}.cta small{display:block;text-align:center;font-size:14px;color:#999;margin-top:12px}
.note{background:#e8f2ea;padding:18px;font-size:15px;line-height:1.8}.note b{color:var(--btn);display:block;margin-bottom:4px}.note a{color:var(--btn);font-weight:500}
.nx{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--text);border-bottom:1px solid var(--line);padding:18px 0;margin-top:56px;font-size:16px}
.nx a:last-child{display:flex;align-items:center;gap:14px;text-align:right}.nx small{display:block;font-size:13px;letter-spacing:.14em;color:var(--muted)}.nx img{width:56px;height:42px;object-fit:cover}
.more{margin-top:64px}.mh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.mh small{display:block;font-size:14px;letter-spacing:.14em;color:var(--muted)}.mh h2{font-weight:300;font-size:29px}.mh a{font-size:15px;font-weight:500}
.slw{position:relative}.sl{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding-bottom:10px}
.sl .card{flex:0 0 calc((100% - 32px)/3);scroll-snap-align:start}
.ar{position:absolute;top:calc(50% - 50px);z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:27px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}.ar.l{left:-14px}.ar.r{right:-14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.th{aspect-ratio:3/2;background:linear-gradient(135deg,#c9c6c0,#8d8a85);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:15px;letter-spacing:.2em}.th{position:relative}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#ebe9e5;display:block;transition:.3s}.card:hover .th img{transform:scale(1.04)}
.cm{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:10px 0 2px}.card b{display:block;font-size:18px;font-weight:500}
.sub{color:var(--muted);font-size:17px;margin:10px 0 28px}.empty{color:var(--muted);padding:60px 0;text-align:center}
footer{background:#000;color:#aaa;font-size:15px;padding:32px 0}footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:1.9}
@media(max-width:960px){.lay{grid-template-columns:1fr}.side{position:static}.nav{display:none}.hd{grid-template-columns:1fr auto}.sl .card{flex-basis:calc((100% - 16px)/2)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.wrap{padding:0 20px}.sec{grid-template-columns:1fr;gap:8px}.sl .card{flex-basis:70%}.grid{grid-template-columns:1fr}.hr .pill:last-child{display:none}.gt small{display:none}.ar.l{left:-8px}.ar.r{right:-8px}.tm{flex-direction:column;gap:4px}}
.ga,.ar{display:grid;place-items:center;padding:0;line-height:0}.ga svg,.ar svg{display:block}

/* ===== 효과 (움직임 줄이기 설정 시 자동 비활성) ===== */
#prog{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--btn);transform:scaleX(0);transform-origin:left;z-index:80;pointer-events:none}
header{transition:box-shadow .3s}header.sc{box-shadow:0 4px 18px rgba(0,0,0,.08)}
@media(prefers-reduced-motion:no-preference){
@keyframes fxUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fxFade{from{opacity:.25;transform:scale(1.03)}to{opacity:1;transform:none}}
#app>*{animation:fxUp .8s cubic-bezier(.2,.7,.2,1) both}#app>*:nth-child(2){animation-delay:.1s}#app>*:nth-child(3){animation-delay:.2s}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.rv.in{opacity:1;transform:none}
.grid .card.in:hover{transform:translateY(-6px)}
.card{transition:transform .35s}
.th{border-radius:2px}
.gm img.fxf{animation:fxFade .55s cubic-bezier(.2,.7,.2,1)}
.ga,.ar{transition:transform .2s,box-shadow .2s}.ga:hover,.ar:hover{transform:scale(1.1);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ga{margin-top:-18px}
.gt button{transition:transform .25s,opacity .25s}.gt button:hover{transform:translateY(-3px)}
}
</style>
</head>
